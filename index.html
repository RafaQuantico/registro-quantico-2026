<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndustrIA Day 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="./img/favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <div class="app-container">
        <!-- Pantalla 2: Grabación -->
        <section id="screen-2" class="screen active">
            <div class="content" style="height: 100%; justify-content: space-between; gap: 0;">
                <img src="./img/header01.png" alt="Header" class="fade-in header-img"
                    style="max-width: 100%; object-fit: contain;">

                <div class="middle-section">
                    <p class="fade-in" style="font-weight: 500; font-size: 1.125rem; text-align: center; margin-bottom: 0px;">Déjanos tus datos para registrarte en el evento.</p>
                    <div class="record-container fade-in delay-1">
                        <button id="btn-record" class="btn-record">
                            <svg viewBox="0 0 24 24" class="mic-icon">
                                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
                                <path
                                    d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
                            </svg>
                        </button>
                        <p id="record-status" class="status-text">Presiona para grabar</p>
                    </div>

                    <div class="alt-action fade-in delay-2" style="text-align: center; margin-top: 24px;">
                        <p style="font-size: 0.95rem; color: var(--text-secondary);">Si no quieres/puedes hablar haz click
                            <button id="btn-text-form" class="btn-text" style="display:inline; padding:0;">aquí</button></p>
                    </div>

                    <div id="upload-status" class="upload-status hidden" style="text-align: center; margin-top: 24px;">
                        <div class="spinner" style="margin: 0 auto 12px;"></div>
                        <p>Enviando registro...</p>
                    </div>
                </div>

                <img src="./img/footer01.png" alt="Footer" class="fade-in delay-3 footer-img"
                    style="max-width: 100%; object-fit: contain;">
            </div>
        </section>

        <!-- Pantalla de Formulario de Texto (Alternativa) -->
        <section id="screen-form" class="screen hidden">
            <div class="content">
                <h2 class="fade-in">Tus Datos</h2>
                <p class="instruction fade-in delay-1">Por favor completa la siguiente información para tu registro.</p>

                <form id="text-form" class="form-container fade-in delay-2">
                    <div class="input-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div class="input-group">
                        <label for="correo">Correo</label>
                        <input type="email" id="correo" name="correo" required>
                    </div>
                    <div class="input-group">
                        <label for="empresa">Empresa o Institución</label>
                        <input type="text" id="empresa" name="empresa" required>
                    </div>

                    <button type="submit" class="btn-primary" style="margin-top: 20px;">Enviar Registro</button>
                </form>

                <div id="form-upload-status" class="upload-status hidden">
                    <div class="spinner"></div>
                    <p>Enviando registro...</p>
                </div>

                <button id="btn-back" class="btn-text fade-in delay-3" style="display: flex; align-items: center; justify-content: center; margin-top: 30px; gap: 8px; width: 100%;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Volver
                </button>
            </div>
        </section>

        <!-- Pantalla 3: Despedida -->
        <section id="screen-3" class="screen hidden">
            <div class="content">
                <h1 class="fade-in">¡Gracias!</h1>
                <p class="fade-in delay-1">Enviaremos pronto un correo con los detalles del evento.</p>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>

</html>
